[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://densa.dev"
repository = "https://github.com/densa-rs/densa-connectors"
readme = "README.md"
# The same minimum as densa's crates.
rust-version = "1.90"

[workspace.dependencies]
# Arrow 60, as densa uses: batches pass between the two without conversion.
arrow-array = "60"
arrow-buffer = "60"
arrow-csv = "60"
arrow-ipc = "60"
arrow-json = "60"
arrow-schema = "60"
arrow-select = "60"
# JSON values, to read a stream's columns from its first message (arrow-json uses them too).
# Not `preserve_order`: it would change every JSON map in the build; densa-ws reads the
# fields' order itself.
serde = "1"
serde_json = "1"
# WebSocket without an async runtime; TLS through rustls on the ring backend (no C toolchain
# beyond what ring needs, no OpenSSL).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Arrow Flight over gRPC (tonic): the client runs a small tokio runtime on the stream's own
# thread, so apps need no async runtime of their own.
arrow-flight = { version = "60", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
tonic = { version = "0.14", default-features = false }
# DataFusion 55 is built on Arrow 59: densa-datafusion moves batches between the two
# through Arrow IPC streams. SQL, Parquet and the common function families only.
datafusion = { version = "55", default-features = false, features = ["sql", "parquet", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions", "nested_expressions"] }
# Codecs are densa-files features.
parquet = { version = "60", default-features = false, features = ["arrow"] }
densa-datafusion = { path = "crates/densa-datafusion", version = "0.1.0" }
densa-files = { path = "crates/densa-files", version = "0.1.0" }
densa-flight = { path = "crates/densa-flight", version = "0.1.0" }
densa-ws = { path = "crates/densa-ws", version = "0.1.0" }
# densa's crates, for the apps, and for the connectors' `paged` features (the connectors
# themselves do not depend on densa).
# 0.2.5: the first with PagedModel, which the page sources need.
densa-arrow = "0.2.5"
densa-data = "0.2.5"
densa-grid = "0.2.5"
densa-ui = "0.2.5"
densa-widgets = "0.2.5"
densa-window = "0.2.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[profile.release]
debug = 1
