[package]
name = "densa-files"
description = "CSV and Parquet files as Arrow record batches, read on a background thread: for densa and any Arrow consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["arrow", "parquet", "csv", "streaming", "data"]
categories = ["data-structures", "parser-implementations"]

[dependencies]
arrow-array.workspace = true
arrow-csv.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
# The `paged` feature: a Parquet file's rows a page at a time for densa's PagedModel.
densa-arrow = { workspace = true, optional = true }

[dev-dependencies]
# The `paged` tests: pages joined to compare with a whole read, the grid model's cells, and
# the bytes a page reads.
arrow-select.workspace = true
bytes = "1"
densa-grid.workspace = true

[features]
default = ["snappy", "gzip", "lz4", "zstd", "brotli"]
# Parquet compression codecs.
snappy = ["parquet/snap"]
gzip = ["parquet/flate2-zlib-rs"]
lz4 = ["parquet/lz4"]
zstd = ["parquet/zstd"]
brotli = ["parquet/brotli"]
# A Parquet file's rows a page at a time (OpenOptions::paged), for densa's PagedModel.
paged = ["dep:densa-arrow"]

[package.metadata.docs.rs]
features = ["paged"]

[lints]
workspace = true
