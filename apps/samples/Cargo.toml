[package]
name = "samples"
description = "Sample data the connector apps show: a service's web requests, a stream of sensor readings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
tungstenite.workspace = true
# The Flight service (feature `flight`).
arrow-flight = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["net"], optional = true }
tonic = { workspace = true, optional = true }
# Flight SQL's list of tables, decoded from the request (feature `flight`).
prost = { version = "0.14", default-features = false, optional = true }

[features]
flight = [
    "dep:arrow-flight",
    "arrow-flight/flight-sql",
    "dep:futures",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
]

[lints]
workspace = true
