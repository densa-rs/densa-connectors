[package]
name = "samples"
description = "Sample data the connector apps show: a service's web requests, a stream of sensor readings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
tungstenite.workspace = true
# The Flight service (feature `flight`).
arrow-flight = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["net"], optional = true }
tonic = { workspace = true, optional = true }
# Flight SQL's list of tables, decoded from the request (feature `flight`).
prost = { version = "0.14", default-features = false, optional = true }
# The Flight SQL service that runs statements (feature `flight-sql`).
densa-datafusion = { workspace = true, optional = true }
# The requests as a Parquet file (feature `parquet`).
parquet = { workspace = true, features = ["snap"], optional = true }

[dev-dependencies]
# Reads the schemas in the list of tables back.
arrow-ipc.workspace = true

[features]
flight = [
    "dep:arrow-flight",
    "arrow-flight/flight-sql",
    "dep:futures",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
]
# A Flight SQL service that runs the statements it is given, with DataFusion.
flight-sql = ["flight", "dep:densa-datafusion"]
# The requests written to a Parquet file.
parquet = ["dep:parquet"]

[lints]
workspace = true
